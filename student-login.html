<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CampusCare</title>
    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <header>
        <h1>CampusCare 🏫</h1>
        <p>Student Login</p>
    </header>

    <main>
        <div class="login-box">
            <h2>Student Login</h2>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p id="message"></p>

            <p>Don't have an account?</p>
            <button type="button" onclick="registerStudent()">Register</button>
        </div>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            try {
                const response = await fetch("https://campuscare-j018.onrender.com/student-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                message.textContent = data.message;
if (response.ok) {
    setTimeout(function() {
        window.location.href = ("https://campuscare-jd18.onrender.com/complaint")}, 1000);
}
            } catch (error) {
                message.textContent = "Unable to connect to CampusCare server.";
            }
        });

        function registerStudent() {
            alert("Student registration will be added next!");
        }
    </script>

</body>
</html>
