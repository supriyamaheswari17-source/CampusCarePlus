<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusCarePlus</title>

    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">
            🏫 CampusCarePlus
        </div>

        <nav>
            <a href="campus.html">Home</a>
        </nav>
    </header>


    <!-- Login Section -->
    <main>

        <div class="login-box">

            <div style="text-align: center; font-size: 42px; margin-bottom: 10px;">
                🎓
            </div>

            <h2>Student Login</h2>

            <p style="
                text-align: center;
                color: #667085;
                margin-bottom: 25px;
                font-size: 14px;
            ">
                Login to manage and track your campus complaints.
            </p>


            <form id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your college email"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <div style="
                text-align: center;
                margin-top: 25px;
                color: #667085;
                font-size: 14px;
            ">
                Don't have an account?
            </div>


            <button
                type="button"
                onclick="registerStudent()"
                style="
                    background: white;
                    color: #1d5db5;
                    border: 1px solid #1d5db5;
                    margin-top: 12px;
                "
            >
                Create Student Account
            </button>

        </div>

    </main>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                message.textContent = "Logging in...";
                message.style.color = "#1d5db5";


                try {

                    const response = await fetch(
                        "https://campuscareplus-klmc.onrender.com/student-login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data = await response.json();


                    message.textContent =
                        data.message || "Login completed.";


                    if (response.ok) {

                        message.style.color = "green";


                        setTimeout(function() {

                            window.location.href =
                                "complaint.html";

                        }, 1000);

                    } else {

                        message.style.color = "red";

                    }


                } catch (error) {

                    message.textContent =
                        "Unable to connect to CampusCarePlus server.";

                    message.style.color = "red";

                }

            });


        function registerStudent() {

            window.location.href = "student-register.html";

        }

    </script>

</body>
</html>
