<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - CampusCare</title>
    <link rel="stylesheet" href="/campus.css">
</head>

<body>

<header>
    <h1>CampusCare 🏫</h1>
    <p>My Complaint Status</p>
</header>

<main>
    <div class="status-box">

        <h2>Check My Complaints</h2>

        <form id="statusForm">
            <label>Student Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <button type="submit">View Complaints</button>
        </form>

        <div id="message"></div>

        <table id="complaintsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="complaintsBody"></tbody>
        </table>

    </div>
</main>
<script>
document.getElementById("statusForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;

    try {
        const response = await fetch(
            `/student-complaints/${encodeURIComponent(email)}`
        );

        const complaints = await response.json();

        const table = document.getElementById("complaintsTable");
        const body = document.getElementById("complaintsBody");
        const message = document.getElementById("message");

        body.innerHTML = "";

        if (complaints.length === 0) {
            table.style.display = "none";
            message.textContent = "No complaints found for this email.";
            return;
        }

        message.textContent = "";
        table.style.display = "table";

        complaints.forEach(complaint => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${complaint.title}</td>
                <td>${complaint.category}</td>
                <td>${complaint.description}</td>
                <td>${complaint.status}</td>
                <td>${complaint.created_at}</td>
            `;

            body.appendChild(row);
        });

    } catch (error) {
        document.getElementById("message").textContent =
            "Unable to load complaints.";
    }
});
</script>
</body>
</html>
