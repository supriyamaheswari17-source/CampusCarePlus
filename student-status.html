<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Complaints | CampusCarePlus</title>

    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            🏫 CampusCarePlus
        </div>

        <nav>
            <a href="complaint.html">Submit Complaint</a>
            <a href="student-status.html">My Complaints</a>
            <a href="student-login.html">Logout</a>
        </nav>

    </header>


    <!-- Complaint Status -->
    <main>

        <div class="status-box">

            <div style="
                text-align: center;
                font-size: 42px;
                margin-bottom: 10px;
            ">
                🔎
            </div>

            <h2>My Complaints</h2>

            <p style="
                text-align: center;
                color: #667085;
                margin-bottom: 25px;
                font-size: 14px;
            ">
                Enter your registered email to view your complaints.
            </p>


            <form id="statusForm">

                <label for="email">
                    Student Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <button type="submit">
                    View My Complaints
                </button>

            </form>


            <div id="message"></div>


            <!-- Complaints Table -->
            <div style="overflow-x: auto; margin-top: 25px;">

                <table
                    id="complaintsTable"
                    style="display: none;"
                >

                    <thead>

                        <tr>
                            <th>Complaint</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>

                    </thead>

                    <tbody id="complaintsBody"></tbody>

                </table>

            </div>


            <button
                type="button"
                onclick="window.location.href='complaint.html'"
                style="
                    background: white;
                    color: #1d5db5;
                    border: 1px solid #1d5db5;
                    margin-top: 25px;
                "
            >
                + Submit New Complaint
            </button>

        </div>

    </main>


    <script>

        document
            .getElementById("statusForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const table =
                    document.getElementById("complaintsTable");

                const body =
                    document.getElementById("complaintsBody");

                const message =
                    document.getElementById("message");


                message.textContent =
                    "Loading your complaints...";

                message.style.color = "#1d5db5";

                table.style.display = "none";

                body.innerHTML = "";


                try {

                    const response = await fetch(
                        `https://campuscareplus-klmc.onrender.com/student-complaints/${encodeURIComponent(email)}`
                    );


                    if (!response.ok) {
                        throw new Error("Unable to load complaints");
                    }


                    const complaints =
                        await response.json();


                    if (!Array.isArray(complaints) ||
                        complaints.length === 0) {

                        message.textContent =
                            "No complaints found for this email.";

                        message.style.color = "#667085";

                        return;
                    }


                    message.textContent =
                        `${complaints.length} complaint(s) found.`;

                    message.style.color = "#1d5db5";

                    table.style.display = "table";


                    complaints.forEach(function(complaint) {

                        const row =
                            document.createElement("tr");


                        const title =
                            document.createElement("td");

                        title.textContent =
                            complaint.title || "-";


                        const category =
                            document.createElement("td");

                        category.textContent =
                            complaint.category || "-";


                        const description =
                            document.createElement("td");

                        description.textContent =
                            complaint.description || "-";


                        const status =
                            document.createElement("td");

                        status.textContent =
                            complaint.status || "Pending";


                        const date =
                            document.createElement("td");

                        date.textContent =
                            complaint.created_at || "-";


                        row.appendChild(title);
                        row.appendChild(category);
                        row.appendChild(description);
                        row.appendChild(status);
                        row.appendChild(date);


                        body.appendChild(row);

                    });

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to load complaints. Please try again.";

                    message.style.color = "red";

                }

            });

    </script>

</body>

</html>
