<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | CampusCarePlus</title>

    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            🏫 CampusCarePlus
        </div>

        <nav>
            <a href="campus.html">Home</a>
            <a href="student-login.html">Login</a>
        </nav>

    </header>


    <!-- Registration -->
    <main>

        <div class="login-box">

            <div style="
                text-align: center;
                font-size: 42px;
                margin-bottom: 10px;
            ">
                🎓
            </div>

            <h2>Create Student Account</h2>

            <p style="
                text-align: center;
                color: #667085;
                margin-bottom: 25px;
                font-size: 14px;
            ">
                Register to report and track campus complaints.
            </p>


            <form id="registerForm">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="roll_number">Roll Number</label>

                <input
                    type="text"
                    id="roll_number"
                    placeholder="Enter your roll number"
                    required
                >


                <label for="department">Department</label>

                <input
                    type="text"
                    id="department"
                    placeholder="Example: CSE"
                    required
                >


                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p
                id="message"
                style="margin-top: 18px;"
            ></p>


            <p style="
                text-align: center;
                margin-top: 22px;
                color: #667085;
                font-size: 14px;
            ">
                Already have an account?
            </p>


            <button
                type="button"
                onclick="goToLogin()"
                style="
                    background: white;
                    color: #1d5db5;
                    border: 1px solid #1d5db5;
                    margin-top: 10px;
                "
            >
                Go to Student Login
            </button>

        </div>

    </main>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const message =
                    document.getElementById("message");


                const data = {

                    name:
                        document.getElementById("name").value.trim(),

                    roll_number:
                        document.getElementById("roll_number").value.trim(),

                    department:
                        document.getElementById("department").value.trim(),

                    email:
                        document.getElementById("email").value.trim(),

                    password:
                        document.getElementById("password").value

                };


                message.textContent = "Creating your account...";
                message.style.color = "#1d5db5";


                try {

                    const response = await fetch(
                        "https://campuscare-j018.onrender.com/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(data)
                        }
                    );


                    const result = await response.json();


                    message.textContent =
                        result.message || "Registration completed.";


                    if (response.ok) {

                        message.style.color = "green";

                        setTimeout(function() {

                            window.location.href =
                                "student-login.html";

                        }, 1200);

                    } else {

                        message.style.color = "red";

                    }


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to CampusCarePlus server.";

                    message.style.color = "red";

                }

            });


        function goToLogin() {

            window.location.href =
                "student-login.html";

        }

    </script>

</body>

</html>
