<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CampusCare</title>
    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <header>
        <h1>CampusCare 🏫</h1>
        <p>Student Registration</p>
    </header>

    <main>
        <div class="login-box">
            <h2>Student Registration</h2>

            <form id="registerForm">

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label>Roll Number</label>
    <input type="text" id="roll_number" placeholder="Enter your roll number" required>

    <label>Department</label>
    <input type="text" id="department" placeholder="Enter your department" required>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password" required>

    <button type="submit">Register</button>

</form>
            </form>
            <p>Already registered?
                <a href="https://campuscare-j018.onrender.com/student-login-page">Go to student login</a>
            </p>

            <p id="message"></p>

        </div>
    </main>
<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        roll_number: document.getElementById("roll_number").value,
        department: document.getElementById("department").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("https://campuscare-j018.onrender.com/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        document.getElementById("message").textContent = result.message;
if (response.ok) {
    setTimeout(function() {
        window.location.href = "/student-login-page";
    }, 1000);
}
    } catch (error) {
        console.error(error);
        document.getElementById("message").textContent =
            "Unable to connect to CampusCare server.";
    }
});
</script>
</body>
</html>
