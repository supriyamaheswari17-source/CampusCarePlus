<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CampusCare</title>
    <link rel="stylesheet" href="/campus.css">
</head>

<body>

    <header>
        <h1>CampusCare 🏫</h1>
        <p>Administrator Login</p>
    </header>

    <main>
        <div class="login-box">
            <h2>Admin Login</h2>

            <form id="adminLoginForm">

    <label>Username</label>
    <input type="text" id="username"
           placeholder="Enter username" required>

    <label>Password</label>
    <input type="password" id="password"
           placeholder="Enter password" required>

    <button type="submit">Login</button>

</form>

<p id="message"></p>
        </div>
    </main>
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("https://campuscare-jd18.onrender.com/admin-login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            window.location.href = "https://campuscare-j018.onrender.com/admin-dashboard";
        } else {
            document.getElementById("message").textContent = result.message;
        }

    } catch (error) {
        document.getElementById("message").textContent =
            "Unable to connect to CampusCare server.";
    }
});
</script>
</body>
</html>
