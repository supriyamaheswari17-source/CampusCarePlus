<!DOCTYPE html>
<html>
<head>
    <title>CampusCare - Admin Dashboard</title>
    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <header>
        <h1>CampusCare 🏫</h1>
        <p>Admin Dashboard</p>
        <nav><a href="/admin-dashboard">Dashboard</a>
            <a href="/complaint">Complaints</a>
            <a href="/admin">Logout</a>
        </nav>
    </header>

    <main>
        <h2>Student Complaints</h2>
        <div class="stats-container">

    <div class="stat-card">
        <h3>Total Complaints</h3>
        <p id="totalComplaints">0</p>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingComplaints">0</p>
    </div>

    <div class="stat-card">
        <h3>In Progress</h3>
        <p id="progressComplaints">0</p>
    </div>

    <div class="stat-card">
        <h3>Resolved</h3>
        <p id="resolvedComplaints">0</p>
    </div>

</div>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Email</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Updated Status</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="complaintsTable">
            </tbody>
        </table>

        <p id="message"></p>
        <script>
async function loadComplaints() {
    try {
        const response = await fetch("/complaints");
        const complaints = await response.json();
document.getElementById("totalComplaints").textContent = complaints.length;

document.getElementById("pendingComplaints").textContent =
    complaints.filter(c => c.status === "Pending").length;

document.getElementById("progressComplaints").textContent =
    complaints.filter(c => c.status === "In Progress").length;

document.getElementById("resolvedComplaints").textContent =
    complaints.filter(c => c.status === "Resolved").length;
        const table = document.getElementById("complaintsTable");

        table.innerHTML = "";

        complaints.forEach(complaint => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${complaint.id}</td>
                <td>${complaint.student_email}</td>
                <td>${complaint.title}</td>
                <td>${complaint.category}</td>
                <td>${complaint.description}</td>
                <td>${complaint.status}</td>
<td>
    <select onchange="updateStatus(${complaint.id}, this.value)">
        <option value="Pending" ${complaint.status === "Pending" ? "selected" : ""}>Pending</option>
        <option value="In Progress" ${complaint.status === "In Progress" ? "selected" : ""}>In Progress</option>
        <option value="Resolved" ${complaint.status === "Resolved" ? "selected" : ""}>Resolved</option>
    </select>
</td>
                <td>${complaint.created_at}</td>
            `;

            table.appendChild(row);
        });

    } catch (error) {
        document.getElementById("message").textContent =
            "Unable to load complaints.";
    }
}
async function updateStatus(id, status) {
    const response = await fetch(
        `https://campuscare-j018.onrender.com/update-status/${id}`,
        {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ status: status })
        }
    );

    const result = await response.json();

    document.getElementById("message").textContent = result.message;
}
    loadComplaints();


</script>

    </main>

</body>
</html>
