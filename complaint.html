<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint | CampusCarePlus</title>

    <link rel="stylesheet" href="campus.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            🏫 CampusCarePlus
        </div>

        <nav class="nav-links">
            <a href="campus.html">Home</a>
            <a href="complaint.html">Submit Complaint</a>
            <a href="student-status.html">My Complaints</a>
            <a href="student-login.html">Logout</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main class="complaint-page">

        <div class="complaint-box">

            <div class="page-icon">
                📝
            </div>

            <h2>Submit a Complaint</h2>

            <p class="form-subtitle">
                Report a campus issue and help us make your
                college experience better.
            </p>


            <form id="complaintForm">

                <!-- Student Email -->
                <label for="student_email">
                    Student Email
                </label>

                <input
                    type="email"
                    id="student_email"
                    placeholder="Enter your registered email"
                    required
                >


                <!-- Complaint Title -->
                <label for="title">
                    Complaint Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Wi-Fi not working"
                    maxlength="100"
                    required
                >


                <!-- Category -->
                <label for="category">
                    Complaint Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select a category
                    </option>

                    <option value="Academic">
                        Academic
                    </option>

                    <option value="Hostel">
                        Hostel
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Canteen">
                        Canteen / Food
                    </option>

                    <option value="Infrastructure">
                        Infrastructure
                    </option>

                    <option value="Cleanliness">
                        Cleanliness
                    </option>

                    <option value="Electricity">
                        Electricity
                    </option>

                    <option value="Water">
                        Water
                    </option>

                    <option value="Wi-Fi / Internet">
                        Wi-Fi / Internet
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Location -->
                <label for="location">
                    Issue Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: CSE Block - Room 204"
                    maxlength="150"
                    required
                >


                <!-- Description -->
                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the issue clearly..."
                    maxlength="1000"
                    required
                ></textarea>

                <small class="character-note">
                    Maximum 1000 characters
                </small>


                <!-- Submit Button -->
                <button
                    type="submit"
                    id="submitButton"
                >
                    Submit Complaint
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <!-- Status -->
            <div class="status-link">

                <p>
                    Already submitted a complaint?
                </p>

                <button
                    type="button"
                    onclick="window.location.href='student-status.html'"
                >
                    View My Complaints
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 CampusCarePlus.
            Smart Campus • Better Campus.
        </p>

    </footer>


    <script>

        const form =
            document.getElementById("complaintForm");

        const message =
            document.getElementById("message");

        const submitButton =
            document.getElementById("submitButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const data = {

                    student_email:
                        document
                            .getElementById("student_email")
                            .value
                            .trim(),

                    title:
                        document
                            .getElementById("title")
                            .value
                            .trim(),

                    category:
                        document
                            .getElementById("category")
                            .value,

                    location:
                        document
                            .getElementById("location")
                            .value
                            .trim(),

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim()

                };


                // Basic validation
                if (
                    !data.student_email ||
                    !data.title ||
                    !data.category ||
                    !data.location ||
                    !data.description
                ) {

                    message.textContent =
                        "Please fill in all the fields.";

                    message.style.color = "red";

                    return;

                }


                // Disable button
                submitButton.disabled = true;

                submitButton.textContent =
                    "Submitting...";


                message.textContent =
                    "Submitting your complaint...";

                message.style.color =
                    "#1d5db5";


                try {

                    const response =
                        await fetch(
                            "https://campuscareplus-klmc.onrender.com/submit-complaint",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)
                            }
                        );


                    const result =
                        await response.json();


                    if (response.ok) {

                        message.textContent =
                            result.message ||
                            "Complaint submitted successfully!";

                        message.style.color =
                            "green";


                        form.reset();


                    } else {

                        message.textContent =
                            result.message ||
                            "Unable to submit complaint.";

                        message.style.color =
                            "red";

                    }


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to CampusCarePlus server.";

                    message.style.color =
                        "red";

                }


                // Enable button again
                submitButton.disabled = false;

                submitButton.textContent =
                    "Submit Complaint";

            }
        );

    </script>

</body>

</html>
