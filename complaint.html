            <main>
    <div class="complaint-box">

        <h2>Submit Complaint</h2>

        <form id="complaintForm">

            <label>Student Email</label>
            <input type="email" id="student_email"
                   placeholder="Enter your registered email" required>

            <label>Complaint Title</label>
            <input type="text" id="title"
                   placeholder="Enter complaint title" required>

            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Academic">Academic</option>
                <option value="Hostel">Hostel</option>
                <option value="Transport">Transport</option>
                <option value="Canteen">Canteen</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Other">Other</option>
            </select>

            <label>Description</label>
            <textarea id="description"
                      placeholder="Describe your complaint"
                      required></textarea>

            <button type="submit">Submit Complaint</button>

        </form>

        <p id="message"></p>

        <!-- JavaScript goes here -->
        <script>
        document.getElementById("complaintForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                student_email: document.getElementById("student_email").value,
                title: document.getElementById("title").value,
                category: document.getElementById("category").value,
                description: document.getElementById("description").value
            };

            try {
                const response = await fetch("https://campuscare-j018.onrender.com/submit-complaint", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById("message").textContent = result.message;

            } catch (error) {
                document.getElementById("message").textContent =
                    "Unable to connect to CampusCare server.";
            }
        });
        </script>

    </div>
</main>

</body>
